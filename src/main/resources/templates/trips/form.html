<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${trip.id} ? 'Edit Memory' : 'New Memory'">Memory Form</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; max-width: 560px; margin: 40px auto; padding: 0 20px; background: #f9f9f9; }
        h1 { color: #333; }
        label { display: block; margin-top: 16px; font-weight: bold; font-size: 14px; color: #555; }
        input[type=text], input[type=date], textarea {
            width: 100%; padding: 9px 12px; margin-top: 6px; border: 1px solid #ccc;
            border-radius: 4px; font-size: 14px; background: #fff;
        }
        textarea { height: 100px; resize: vertical; }
        .current-img { margin-top: 8px; }
        .current-img img { max-width: 200px; border-radius: 4px; display: block; margin-top: 4px; }
        .actions { margin-top: 24px; display: flex; gap: 12px; }
        .btn { padding: 9px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; text-decoration: none; display: inline-block; }
        .btn-primary { background: #4a90d9; color: #fff; }
        .btn-secondary { background: #888; color: #fff; }
    </style>
</head>
<body>

<h1 th:text="${trip.id} ? 'Edit Memory' : 'New Memory'">Memory Form</h1>

<form th:action="${trip.id} ? @{'/trips/' + ${trip.id}} : @{/trips}"
      method="post" enctype="multipart/form-data">

    <label for="title">Title</label>
    <input type="text" id="title" name="title" th:value="${trip.title}" required placeholder="e.g. Safari in Kenya">

    <label for="destination">Destination</label>
    <input type="text" id="destination" name="destination" th:value="${trip.destination}" placeholder="e.g. Nairobi, Kenya">

    <label for="tripDate">Date</label>
    <input type="date" id="tripDate" name="tripDate" th:value="${trip.tripDate}">

    <label for="notes">Notes</label>
    <textarea id="notes" name="notes" th:text="${trip.notes}" placeholder="What made this trip special?"></textarea>

    <label for="imageFile">Photo</label>
    <div class="current-img" th:if="${trip.imagePath}">
        <small>Current image:</small>
        <img th:src="${trip.imagePath}" th:alt="${trip.title}">
        <small>Upload a new file to replace it.</small>
    </div>
    <input type="file" id="imageFile" name="imageFile" accept="image/*">

    <div class="actions">
        <button type="submit" class="btn btn-primary">Save</button>
        <a th:href="@{/trips}" class="btn btn-secondary">Cancel</a>
    </div>
</form>

</body>
</html>
