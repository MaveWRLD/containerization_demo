<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Trip Memories</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; background: #f9f9f9; }
        h1 { color: #333; }
        .btn { display: inline-block; padding: 8px 18px; background: #4a90d9; color: #fff; text-decoration: none; border-radius: 4px; border: none; cursor: pointer; font-size: 14px; }
        .btn-sm { padding: 5px 12px; font-size: 13px; }
        .btn-danger { background: #e05252; }
        .btn-secondary { background: #888; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin-top: 24px; }
        .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.1); overflow: hidden; }
        .card img { width: 100%; height: 160px; object-fit: cover; }
        .card-placeholder { width: 100%; height: 160px; background: #e0e0e0; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 13px; }
        .card-body { padding: 16px; }
        .card-body h3 { margin: 0 0 6px; font-size: 16px; }
        .card-body p { margin: 0 0 4px; color: #666; font-size: 13px; }
        .card-actions { margin-top: 12px; display: flex; gap: 8px; }
        .empty { margin-top: 40px; text-align: center; color: #999; }
    </style>
</head>
<body>

<h1>Trip Memories</h1>
<a th:href="@{/trips/new}" class="btn">+ New Memory</a>

<div class="grid" th:if="${!trips.isEmpty()}">
    <div class="card" th:each="trip : ${trips}">
        <img th:if="${trip.imagePath}" th:src="${trip.imagePath}" alt="Trip photo">
        <div class="card-placeholder" th:unless="${trip.imagePath}">No image</div>
        <div class="card-body">
            <p th:text="${trip.description}">Description</p>
            <div class="card-actions">
                <a th:href="@{'/trips/' + ${trip.id}}" class="btn btn-sm">View</a>
                <a th:href="@{'/trips/' + ${trip.id} + '/edit'}" class="btn btn-sm btn-secondary">Edit</a>
                <form th:action="@{'/trips/' + ${trip.id} + '/delete'}" method="post" style="display:inline">
                    <button type="submit" class="btn btn-sm btn-danger"
                            onclick="return confirm('Delete this memory?')">Delete</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="empty" th:if="${trips.isEmpty()}">
    <p>No trip memories yet. <a th:href="@{/trips/new}">Add your first one!</a></p>
</div>

</body>
</html>
